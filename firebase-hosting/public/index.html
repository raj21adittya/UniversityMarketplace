<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNC Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #13294B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { text-align: center; max-width: 500px; }
        .logo {
            width: 100px; height: 100px;
            background: #4B9CD3;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 48px;
        }
        h1 { font-size: 32px; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 17px; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #4B9CD3;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏛️</div>
        <h1>UNC Marketplace</h1>
        <p>Buy &amp; sell with fellow Tar Heels.<br>A trusted marketplace exclusively for UNC Chapel Hill students.</p>
        <div class="badge">📱 Available on iOS</div>
    </div>
</body>
</html>
